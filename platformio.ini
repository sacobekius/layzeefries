; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; platformio_local.ini bevat de nano_esp32_ota omgeving (OTA-wachtwoord erin,
; daarom niet gecommit). Zie platformio_local.ini.example.
[platformio]
extra_configs = platformio_local*.ini

[env:nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 9600
; Board-default is dfu-util, maar dat geeft op macOS regelmatig
; LIBUSB_ERROR_IO (bekend libusb/driverconflict). esptool is stabieler.
upload_protocol = esptool
; Geen vast upload_port: dit board heeft een native USB-CDC-poort waarvan
; de /dev-naam verandert zodra het board naar de bootloader reset (andere
; USB-identiteit). Een vaste naam klopt dan niet meer tijdens het flashen
; zelf. Laat esptool.py de poort steeds opnieuw auto-detecteren.
; Lager dan de board-default (460800): stabieler bij een marginale
; USB-verbinding (kabel/hub) die haperde tijdens het schrijven.
upload_speed = 115200

lib_deps =
    milesburton/DallasTemperature
    paulstoffregen/OneWire
    ; Vervangt de ingebouwde "ESP32 BLE Arduino" (Bluedroid) library: lichter
    ; qua RAM/flash. Niet zelf de oorzaak van de WiFi+BLE reset-loop die we
    ; hier tegenkwamen (dat was WiFi.setSleep(false), zie main.cpp), maar wel
    ; de moeite waard om te houden.
    h2zero/NimBLE-Arduino